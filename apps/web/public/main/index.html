    <script>
      (function () {
        var routeMap = {
          '/': '/home',
          '/home': '/home',
          '/main': '/main',
          '/shop': '/shop',
          '/ready-to-wear': '/ready-to-wear',
          '/rtw': '/ready-to-wear',
          '/fabrics': '/fabrics',
          '/ftb': '/fabrics',
          '/fabric-to-buy': '/fabrics',
          '/custom': '/custom',
          '/ctw': '/custom',
          '/contact': '/contact',
          '/contact-us': '/contact',
          '/login': '/login',
          '/auth/login': '/login',
          '/signin': '/login',
          '/sign-in': '/login',
          '/register': '/register',
          '/auth/register': '/register',
          '/signup': '/register',
          '/sign-up': '/register',
          '/forgot-password': '/forgot-password',
          '/auth/forgot-password': '/forgot-password',
          '/reset-password': '/reset-password',
          '/auth/reset-password': '/reset-password'
        };

        var redirectFromHash = function () {
          var rawHash = String(window.location.hash || '').trim();
          if (!rawHash || rawHash.indexOf('#/') !== 0) return;
          var value = rawHash.slice(1);
          var queryIndex = value.indexOf('?');
          var pathPart = (queryIndex >= 0 ? value.slice(0, queryIndex) : value).toLowerCase();
          var queryPart = queryIndex >= 0 ? value.slice(queryIndex) : '';
          var target = routeMap[pathPart];
          if (!target) return;
          window.location.replace(target + queryPart);
        };

        window.addEventListener('hashchange', redirectFromHash);
        redirectFromHash();
      })();
    </script>
