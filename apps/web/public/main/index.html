        };

        var normalizeHashPath = function (hashValue) {
          var value = String(hashValue || '').trim();
          if (!value) return '';
          if (value.indexOf('#') === 0) value = value.slice(1);
          try {
            value = decodeURIComponent(value);
          } catch (_error) {}
          // Normalize malformed static hashes like "#/#signin" or "#/#/signin".
          value = value.replace(/^\/#\/?/, '/');
          value = value.replace(/^#\/?/, '/');
          if (value.indexOf('/') !== 0) value = '/' + value;
          value = value.replace(/\/{2,}/g, '/');
          var queryIndex = value.indexOf('?');
          var pathPart = queryIndex >= 0 ? value.slice(0, queryIndex) : value;
          var queryPart = queryIndex >= 0 ? value.slice(queryIndex) : '';
          pathPart = pathPart.replace(/\/+$/, '');
          if (!pathPart) pathPart = '/';
          value = pathPart + queryPart;
          return value;
        };

        var redirectFromHash = function () {
          var rawHash = String(window.location.hash || '').trim();
          if (!rawHash) return;
          var value = normalizeHashPath(rawHash);
          if (!value) return;
          var queryIndex = value.indexOf('?');
          var pathPart = (queryIndex >= 0 ? value.slice(0, queryIndex) : value).toLowerCase();
          var queryPart = queryIndex >= 0 ? value.slice(queryIndex) : '';
          var target = routeMap[pathPart];
          if (!target) return;
          window.location.replace(target + queryPart);
        };

        document.addEventListener(
          'click',
          function (event) {
            var node = event.target;
            while (node && node.tagName !== 'A') node = node.parentElement;
            if (!node) return;
            var href = String(node.getAttribute('href') || '').trim().toLowerCase();
            if (
              href === '#/#signin' ||
              href === '#/signin' ||
              href === '#signin' ||
              href === '#/#sign-in' ||
              href === '#/sign-in' ||
              href === '#sign-in'
            ) {
              event.preventDefault();
              window.location.replace('/auth/login');
              return;
            }
            if (
              href === '#/#shop' ||
              href === '#/shop' ||
              href === '#shop'
            ) {
              event.preventDefault();
              window.location.replace('/main');
            }
          },
          true
        );
        window.addEventListener('hashchange', redirectFromHash);
        redirectFromHash();
      })();
